actions:
  apisYmlUpdated: true
  openapiDirectoryCreated: false
  reason: |
    No public self-serve developer surface and no machine-readable API artifact
    of any kind exists for Send Technology, so apis[] is intentionally empty and
    no openapi/ directory was created. Recording the honest absence — an
    API-first product whose APIs are reachable only through a commercial
    engagement and the ACORD/placing-platform seam — is the correct outcome for
    this record.
