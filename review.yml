  specifications:
    openapiHarvested: false
    count: 0
    note: No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, or .proto artifact is published anywhere on send.technology or on any resolvable Send subdomain. Nothing was saved because nothing real was found. The openapi/ directory is intentionally absent.
  acordPosture:
    summary: ACORD member; ACORD Standard placing/accounting/claims transactions exchanged via ACORD Solutions Group's ADEPT API; ACORD Forms ingestion for submission triage
    detail: |
      Send announced a strategic partnership with ACORD Solutions Group (ASG),
      the digital solutions subsidiary of ACORD. Per Send's own announcement,
      Send uses ADEPT (ACORD Data Exchange Platform and Translator) via API,
      which "allows Send's customers to seamlessly send and receive ACORD
      Standard accounting, claims, and placing transactions", providing
      eMessaging capabilities for placing, accounting and claims data exchange
      aligned with Lloyd's Blueprint Two. Send also became an ACORD member,
      noting that "Many of Send's customers use ACORD Data Standards and ACORD
      Forms", which Send ingests to "facilitate rapid ingestion of forms to help
      insurers quickly classify and triage new submissions". ACORD is also
      listed as a technology partner and industry membership on
      https://send.technology/partners/. No AL3 flat-file reference and no
      IVANS / agency-download / Applied Epic / Vertafore AMS360 reference was
      found — expected, since those are US agency-management rails and Send's
      centre of gravity is the London Market.
    acordCertified: not claimed
    al3: no reference found
    ivans: no reference found
  insuranceVerbs:
    quote: covered by the product (Quote & Rate Lifecycle Management, Send Rating, Send Studio) but NOT exposed as a public API
    bind: covered by the product (submission-to-bind, Binder Management, Post-Bind Processing) but NOT exposed as a public API
    issue: covered by the product (post-bind processing, endorsements, renewals) but NOT exposed as a public API
    fnol: not a Send product area; claims appear only as ACORD claims transactions carried over ADEPT, not as a Send-published API
    audience: partner-only — underwriters, managing agents, MGAs and reinsurers as licensed customers; no consumer-facing or self-serve agent-facing API
  authModel:
    scheme: not publicly documented
    note: No OAuth 2.0, OpenID Connect, API key or mTLS scheme is documented publicly. /.well-known/openid-configuration and /.well-known/oauth-authorization-server both return 404 on the apex host, and no application/tenant host (app., portal., secure., connect., sandbox.) resolves in DNS. Access to any Send API is arranged through a commercial engagement.
  webhooks:
    exists: unknown/undocumented
    note: No public event catalog, webhook reference or AsyncAPI document exists. Absence is the finding.
  postman:
