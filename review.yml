aid: send-technology
name: Send Technology
review:
  question: Does Send Technology expose a public, self-serve developer portal or a downloadable API definition for its underwriting workbench?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  sector: Insurance
  tier: underwriting-ai
findings:
  summary: |
    Send Technology Solutions Ltd (send.technology) is a London-based insurtech
    that sells an underwriting workbench to commercial and specialty insurers,
    MGAs and reinsurers, with its deepest footprint in the London Market and at
    Lloyd's. Send describes itself in marketing copy as "an API-first platform
    with pre-built connectors for placing platforms like Whitespace and PPL,
    insurance-focused data integrations, rating engines, document stores, and
    policy admin systems", but it publishes NO public developer portal, NO API
    reference, and NO downloadable OpenAPI/Swagger definition. Every first-party
    developer host probed on 2026-07-25 failed to resolve or 404'd. The full
    WordPress page sitemap (43 pages) contains no /developers, /docs, /api or
    /reference page of any kind. The only integration surface is partner- and
    customer-gated: connectors are configured during implementation, and
    standards-based exchange runs through ACORD Solutions Group rather than
    through anything a developer can sign up for. This is the characteristic UK
    London-Market pattern — real market-wide data plumbing (Blueprint Two, PPL,
    Whitespace, ACORD ADEPT) aimed at brokers and syndicates, not developers,
    and therefore invisible from outside.
  developerPortal:
    exists: false
    url: ''
    classification: none — no developer portal, no login wall, no API marketing page
    note: The closest public page is https://send.technology/partners/ (HTTP 200), which is a marketing partner/ecosystem directory listing technology, data and implementation partners. It contains no API documentation and no developer sign-up.
