    Send's insurance integration middleware, described as sitting "at the heart of
    Send Underwriting Workbench". A lightweight micro-service architecture with a
    fully automated deployment mechanism that supports code-free/low-code
    integration routes, pre-built connectors to policy admin, rating and external
    systems, and a real-time view of API and integrated systems with alerting and
    proactive management. Data encrypted in transit and at rest.
